# Nightclub Reborn en https://nightclubreborn.duckdns.org (sin puerto), servido por el nginx compartido de la VPS (sara_nginx).
# En la VPS reemplaza a /opt/futbolito/deploy/futbolito.conf (el original quedo como futbolito.conf.bak-pre-nightclub),
# que sara_nginx monta como /etc/nginx/conf.d/futbolito.conf. El juego es el contenedor nightclub_game, en la red sara_sara_net.
# El certificado (Lets Encrypt por DuckDNS) lo renueva nightclub_proxy y lo copia a la carpeta de certs nightclub-cert-sync.timer.

map $http_upgrade $nc_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name nightclubreborn.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name nightclubreborn.duckdns.org;

    ssl_certificate     /etc/nginx/certs/nightclub.crt;
    ssl_certificate_key /etc/nginx/certs/nightclub.key;

    # nginx arranca aunque el juego este caido
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $nightclub http://nightclub_game:8787;

    # canciones que suben los jugadores (el servidor acepta hasta 15 MB)
    client_max_body_size 20m;

    location / {
        proxy_pass         $nightclub;
        proxy_http_version 1.1;
        # el websocket de la ciudad
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $nc_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
    }
}
